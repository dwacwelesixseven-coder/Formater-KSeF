name: Publish Formater KSeF

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/validate-site.mjs
      - scripts/test-downloads.mjs
      - scripts/cloudflare-project.mjs
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Validate HTML and JavaScript
        run: node scripts/validate-site.mjs

      - name: Check download results and error handling
        run: node scripts/test-downloads.mjs

      - name: Check Cloudflare connection
        id: connection
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare connection required" >> "$GITHUB_STEP_SUMMARY"
            echo "Source validation passed. No site was deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify existing Cloudflare project and production branch
        if: steps.connection.outputs.ready == 'true'
        id: project
        run: node scripts/cloudflare-project.mjs

      - name: Publish to existing Cloudflare Pages project
        if: steps.connection.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=formater-ksef --branch=${{ steps.project.outputs.branch }}
